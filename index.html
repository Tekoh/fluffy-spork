<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;
    font-family:'Quicksand',system-ui,sans-serif;color:#4a1020;
    background:linear-gradient(160deg,#fbe6eb,#f3c9d3)}
  .box{width:100%;max-width:340px;text-align:center;background:rgba(255,255,255,.75);
    border:1.5px solid #f1c6d1;border-radius:26px;padding:34px 22px 28px;box-shadow:0 12px 34px rgba(122,31,53,.14)}
  .lock{font-size:2.6rem;display:inline-block;animation:bob 2.4s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  h1{font-family:'Dancing Script',cursive;color:#7a1f35;font-size:2.2rem;margin:8px 0 4px}
  .q{color:#8a4a5a;margin-bottom:18px;line-height:1.5}
  input{width:100%;font:inherit;font-size:1.4rem;text-align:center;letter-spacing:.2em;
    padding:14px;border-radius:16px;border:2px solid #eab7c4;background:#fff7f3;color:#7a1f35;outline:none}
  input:focus{border-color:#9b2c48}
  button{margin-top:14px;width:100%;font:inherit;font-weight:700;font-size:1.05rem;color:#fff;border:none;cursor:pointer;
    background:linear-gradient(160deg,#9b2c48,#5a1226);padding:14px;border-radius:999px;box-shadow:0 6px 16px rgba(90,18,38,.3)}
  .msg{min-height:1.4em;margin-top:12px;color:#9b2c48;font-size:.92rem}
  .shake{animation:shake .4s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
</style>
</head>

</form>
